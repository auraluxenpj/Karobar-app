<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Starting Karobar-App…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top left, #1e293b 0%, #0f172a 65%, #020617 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
    }
    .logo-badge {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.45);
      margin-bottom: 18px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    h1 span { color: #38bdf8; }
    p {
      margin-top: 6px;
      font-size: 12.5px;
      color: #94a3b8;
    }
    .loader-bar {
      margin-top: 26px;
      width: 220px;
      height: 4px;
      background: rgba(148, 163, 184, 0.16);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .loader-fill {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      border-radius: 999px;
      animation: slide 1.25s infinite ease-in-out;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(240%); }
    }
    .footer {
      position: absolute;
      bottom: 14px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <img src="icon.png" alt="Karobar-App" class="logo-badge" style="object-fit: cover; padding: 0; background: transparent;" />
  <h1>Karobar<span>-</span>App</h1>
  <p id="status">Initializing local database &amp; secure runtime…</p>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <div class="footer">Karobar-App Desktop Edition &bull; Inventory &bull; POS &bull; Accounting</div>
</body>
</html>
