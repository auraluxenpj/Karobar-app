name: Build Windows .exe Installer (Karobar ERP v2)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "scripts/build-windows-exe.ps1"
      - "installer/**"
      - "desktop/**"
      - "resources/**"
      - "app/**"
  workflow_dispatch:
    inputs:
      app_version:
        description: "Installer Version (e.g. 2.0.0)"
        required: false
        default: "2.0.0"

jobs:
  build-windows-exe:
    name: Compile Karobar-ERP-Setup.exe (Win64)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with sodium, sqlite, gd, zip)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, sodium, gd, zip, fileinfo, curl
          tools: composer:v2
          coverage: none

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Production Composer Dependencies
        shell: pwsh
        run: |
          php -v
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Build Windows Desktop Shell & Inno Setup .exe Installer
        shell: pwsh
        run: ./scripts/build-windows-exe.ps1

      - name: Attest Build Provenance to GitHub (shzdasim/Karobar-App)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: "dist/installer/*.exe"

      - name: Upload Karobar-ERP-Setup.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karobar-ERP-Setup-Windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.cer
          retention-days: 30

