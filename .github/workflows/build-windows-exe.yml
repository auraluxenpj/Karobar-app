name: Build Windows .exe Installer (Karobar ERP v2)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "scripts/build-windows-exe.ps1"
      - "installer/**"
      - "desktop/**"
      - "resources/**"
      - "app/**"
  workflow_dispatch:
    inputs:
      app_version:
        description: "Installer Version (e.g. 2.0.0)"
        required: false
        default: "2.0.0"

jobs:
  build-windows-exe:
    name: Compile Karobar-ERP-Setup.exe (Win64)
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with sodium, sqlite, gd, zip)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, sodium, gd, zip, fileinfo, curl
          tools: composer:v2
          coverage: none

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Production Composer Dependencies
        shell: pwsh
        run: |
          php -v
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Build Windows Desktop Shell & Inno Setup .exe Installer
        shell: pwsh
        run: ./scripts/build-windows-exe.ps1

      - name: Attest Build Provenance to GitHub (shzdasim/Karobar-App)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: "dist/installer/*.exe"

      - name: Upload Karobar-ERP-Setup.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karobar-ERP-Setup-Windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.cer
            dist/installer/*.bat
          retention-days: 30

      - name: Publish / Update Official GitHub Release (v2.0.0)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ReleaseTag = "v2.0.0"
          $ReleaseTitle = "Karobar App ERP v2.0.0 — Windows 64-Bit Standalone Desktop Edition"
          $BundleZip = "dist/installer/Karobar-ERP-Setup-v2.0.0-Bundle.zip"
          if (Test-Path $BundleZip) { Remove-Item -Force $BundleZip }
          Compress-Archive -Path "dist/installer/Karobar-ERP-Setup-v2.0.0.exe", "dist/installer/MalikAsimShahzad-KarobarERP.cer", "dist/installer/Install-Karobar-ERP.bat" -DestinationPath $BundleZip -Force

          $ReleaseNotes = @"
          ## Karobar App ERP v2.0.0 (Windows 64-Bit Standalone `.exe`)
          **Author & Developer:** Malik Asim Shahzad ([@shzdasim](https://github.com/shzdasim))

          ### Highlights in This Release
          - **Standalone Zero-Dependency Windows Desktop App**: Bundled with portable PHP 8.4 (Sodium + SQLite3 + GD), Node.js 22 LTS (Local WhatsApp Agent), and Electron Desktop Shell.
          - **Existing Herd SQLite Database Import**: Choose between starting with a fresh database or importing an existing Laravel Herd `database.sqlite` file during installation (automatically clears only old users & old license records while keeping 100% of products, batches, invoices, ledgers, customers, suppliers, and accounts intact).
          - **Hardware-Bound Ed25519 Licensing (`KRB-XXXX-XXXX-XXXX-XXXX`)**: Single-machine cryptographic binding with 1-click Machine ID copy in the installer wizard.
          - **Windows Native Top Menu Bar + Multi-Window (MDI Sub-Windows)**: Access all ERP modules from the native Windows top menu bar and open multiple floating/tiled sub-windows (Sales, Purchases, POS, Ledgers) simultaneously inside the main window.
          - **Authenticode Signed**: Signed with persistent Developer Certificate (`Malik Asim Shahzad (shzdasim)`).

          ### Quick Installation Instructions
          1. Download **`Karobar-ERP-Setup-v2.0.0-Bundle.zip`** (or download `Karobar-ERP-Setup-v2.0.0.exe` directly).
          2. Extract and run **`Install-Karobar-ERP.bat`** to automatically register `MalikAsimShahzad-KarobarERP.cer` into Windows Local Machine Trusted Root & Trusted Publishers and launch the installer as a verified publisher.
          "@

          $NotesFile = "dist/installer/release-notes.md"
          Set-Content -Path $NotesFile -Value $ReleaseNotes -Encoding UTF8

          # Ensure tag points to current commit
          git tag -f $ReleaseTag $env:GITHUB_SHA
          git push origin "refs/tags/$ReleaseTag" --force

          gh release view $ReleaseTag >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Updating existing GitHub Release $ReleaseTag..." -ForegroundColor Cyan
              gh release edit $ReleaseTag --title $ReleaseTitle --notes-file $NotesFile --latest
              gh release upload $ReleaseTag `
                  "dist/installer/Karobar-ERP-Setup-v2.0.0.exe" `
                  "dist/installer/Karobar-ERP-Setup-v2.0.0-Bundle.zip" `
                  "dist/installer/MalikAsimShahzad-KarobarERP.cer" `
                  "dist/installer/Install-Karobar-ERP.bat" `
                  --clobber
          } else {
              Write-Host "Creating new GitHub Release $ReleaseTag..." -ForegroundColor Cyan
              gh release create $ReleaseTag `
                  "dist/installer/Karobar-ERP-Setup-v2.0.0.exe" `
                  "dist/installer/Karobar-ERP-Setup-v2.0.0-Bundle.zip" `
                  "dist/installer/MalikAsimShahzad-KarobarERP.cer" `
                  "dist/installer/Install-Karobar-ERP.bat" `
                  --title $ReleaseTitle `
                  --notes-file $NotesFile `
                  --latest
          }


